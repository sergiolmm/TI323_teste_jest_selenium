name: Teste e Deploy

on:
  push:
    branches: [main, dev]
  
  workflow_dispatch:
    inputs:
      environment:
        description: 'Manual'
        type: choice
        required: true
        default: 'dev'
        options:
          - dev
          - prod
  
jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.changes.outputs.api }}
      app: ${{ steps.changes.outputs.app }}
    steps:
      - name: Mostrando o ambiente escolhido
        run: |
          echo "O ambiente selecionado foi: ${{ github.event.inputs.environment }}"
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            api:
              - 'api/**'
            app:
              - 'app/**'
              
  unitTestApi:
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Get Code from repository
        uses: actions/checkout@v6
      - name: verifica se fez corretamente
        run:  ls -la
      - name: Instala o Node na maquina virtual        
        uses: actions/setup-node@v6
      - name: Instala as dependencias do projeto
        working-directory: api 
        run: npm ci
      - name: Roda os testes
        working-directory: api 
        run: npm run test 
      - name: verifica se fez corretamente
        working-directory: api 
        run:  ls -la        
      - name: Gera relatorio de testes
        uses: dorny/test-reporter@v3
        if: success() || failure()  # roda de qualquer maneira
        with:
          name: JEST tests
          path: ./api/j*.xml
          reporter: jest-junit

      - name: Subir a API em background
        working-directory: api 
        run: npm run start &
        env:
          PORT: 3001
          NODE_ENV: test
      - name: Instala as dependencias do projeto
        working-directory: app 
        run: npm ci
        
      - name: Subir o site em background
        working-directory: app
        run: npm run start &
        env:
          PORT: 3000

      - name: Aguardar serviços ficarem prontos
        run: npx wait-on http://localhost:3001/health http://localhost:3000 --timeout 30000

      - name: Instala as dependencias do projeto
        working-directory: e2e
        run: npm ci    
      - name: Roda os testes Funcionais
        if: success() 
        working-directory: e2e
        run: npm run test 
        env:
          API_URL: http://localhost:3001
          APP_URL: http://localhost:3000
        
      - name: verifica se fez corretamente
        working-directory: e2e 
        run:  ls -la          
      - name: fotos da tela
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Fotos dos testes
          # Path to the release files
          # Gravar as fotos na raiz do projeto no docker

          # path: /home/runner/work//aula_teste_101/aula_teste_101/e2e-tests/screenshots/**/*.png
          path: /home/runner/work//TI323_teste_jest_selenium/TI323_teste_jest_selenium/e2e/screenshots/*.png


